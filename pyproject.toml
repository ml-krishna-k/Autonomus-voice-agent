[project]
name = "autonomous-voice-agent"
version = "0.2.0"
description = "Real-time speech-to-speech voice agent: faster-whisper ASR, streaming LLM, Piper TTS."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "faster-whisper>=1.0.3",
    "piper-tts>=1.2.0",
    "onnxruntime>=1.17",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Local microphone mode only; the hosted service does not use audio hardware.
local = ["sounddevice>=0.4.6"]

[project.scripts]
voice-agent = "app.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
